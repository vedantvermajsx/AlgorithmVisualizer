<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;display=swap');
    </style>
    <pattern id="grid-pat" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#2A2D36" stroke-width="0.8"/>
    </pattern>
    <clipPath id="icon-clip">
      <rect x="0" y="0" width="200" height="200" rx="44"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#0A0C10"/>
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#grid-pat)" clip-path="url(#icon-clip)"/>
  <rect x="0" y="0" width="200" height="200" rx="44" fill="none" stroke="#252830" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="28" y1="22" x2="28" y2="158" stroke="#3A3E4C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="158" x2="178" y2="158" stroke="#3A3E4C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arrow tips -->
  <path d="M21 32 L28 18 L35 32" fill="#3A3E4C"/>
  <path d="M164 150 L180 158 L164 166" fill="#3A3E4C"/>

  <!-- Tick marks Y (0,1,2) -->
  <line x1="22" y1="158" x2="34" y2="158" stroke="#3A3E4C" stroke-width="1.5"/>
  <line x1="22" y1="110" x2="34" y2="110" stroke="#3A3E4C" stroke-width="1.5"/>
  <line x1="22" y1="62"  x2="34" y2="62"  stroke="#3A3E4C" stroke-width="1.5"/>

  <!-- Tick marks X (1, 10, 100) -->
  <line x1="40"  y1="152" x2="40"  y2="164" stroke="#3A3E4C" stroke-width="1.5"/>
  <line x1="88"  y1="152" x2="88"  y2="164" stroke="#3A3E4C" stroke-width="1.5"/>
  <line x1="136" y1="152" x2="136" y2="164" stroke="#3A3E4C" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text font-family="DM Mono,monospace" font-size="13" fill="#4A4E5E" text-anchor="end" x="20" y="162">0</text>
  <text font-family="DM Mono,monospace" font-size="13" fill="#4A4E5E" text-anchor="end" x="20" y="115">1</text>
  <text font-family="DM Mono,monospace" font-size="13" fill="#4A4E5E" text-anchor="end" x="20" y="67">2</text>
  <text font-family="DM Mono,monospace" font-size="13" fill="#4A4E5E" text-anchor="middle" x="40"  y="178">1</text>
  <text font-family="DM Mono,monospace" font-size="13" fill="#4A4E5E" text-anchor="middle" x="88"  y="178">10</text>
  <text font-family="DM Mono,monospace" font-size="13" fill="#4A4E5E" text-anchor="middle" x="136" y="178">100</text>

  <!-- Dashed reference lines -->
  <line x1="88"  y1="110" x2="88"  y2="158" stroke="#4AFFA4" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="28"  y1="110" x2="88"  y2="110" stroke="#4AFFA4" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="136" y1="62"  x2="136" y2="158" stroke="#4AFFA4" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="28"  y1="62"  x2="136" y2="62"  stroke="#4AFFA4" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- log10 curve: (1→40,158) (10→88,110) (100→136,62) smoothly -->
  <path fill="none" stroke="#4AFFA4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
    d="M40,158
       C50,145 58,135 66,126
       S78,115 88,110
       S104,100 114,94
       S128,80 136,62
       C140,52 148,44 156,36"/>

  <!-- Accent dots -->
  <circle cx="40"  cy="158" r="5.5" fill="#4AFFA4"/>
  <circle cx="88"  cy="110" r="5.5" fill="#4AFFA4"/>
  <circle cx="136" cy="62"  r="5.5" fill="#4AFFA4"/>

  <!-- Inner dot (white center) for polish -->
  <circle cx="40"  cy="158" r="2" fill="#0A0C10"/>
  <circle cx="88"  cy="110" r="2" fill="#0A0C10"/>
  <circle cx="136" cy="62"  r="2" fill="#0A0C10"/>

  <!-- log10 label top-left area -->
  <text font-family="DM Mono,monospace" font-size="16" font-weight="500" fill="#4AFFA4" opacity="0.7" x="48" y="48">log</text>
  <text font-family="DM Mono,monospace" font-size="11" fill="#4AFFA4" opacity="0.6" x="76" y="56">10</text>
</svg>
